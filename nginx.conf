# fixture-ticker web: serves the prerendered pages and the client-rendered shell, and proxies the
# api and analytics through this origin so the browser only ever talks to one host (no CORS, and a
# CSP that stays at 'self').

server {
    listen 80;
    server_name _;
    # nginx listens on plain HTTP behind Traefik; an absolute redirect would point at http://.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS, resolved per request through variables in proxy_pass. A literal
    # hostname is resolved once at startup: nginx would refuse to start while the api container is
    # being redeployed, and would pin an address that changes on every deploy. ipv6=off because the
    # Docker bridge has no IPv6 route, so an AAAA answer means silent 502s.
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # Security headers. nginx does NOT inherit add_header into a location that sets any of its own,
    # so every location below repeats them. `always` covers error responses too.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Sent unconditionally: behind a TLS-terminating proxy $scheme is http, so gating on it would
    # never send the header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The CSP is staged (blueprint §8): the structural directives are enforced now, and the full
    # resource allowlist runs report-only until staging traffic shows it clean. Then move it into
    # the enforced header. Sentry is the only third party the browser reaches directly.
    set $csp "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'";
    set $csp_report_only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.ingest.de.sentry.io; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'";
    add_header Content-Security-Policy $csp always;
    add_header Content-Security-Policy-Report-Only $csp_report_only always;

    # Every build that is not production sends noindex (the Dockerfile fills __ROBOTS_TAG__), so a
    # new environment starts hidden. nginx sends no header when the value is empty.
    set $robots_tag "__ROBOTS_TAG__";
    add_header X-Robots-Tag $robots_tag always;

    # ---- The api, on this origin ----
    # __API_UPSTREAM__ is the api's address on the private Docker network (for example
    # http://fixture-ticker-api:8100), filled in by the Dockerfile. The api has no public hostname.
    # A variable in proxy_pass with no URI part passes the request URI through unchanged.
    location ^~ /api/ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex" always;
        set $api_upstream "__API_UPSTREAM__";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- PostHog (EU) reverse proxy ----
    # `^~` so the asset regex location below can't claim /ingest/static/*.js. Runtime DNS and SNI
    # for the same reasons as above; without proxy_ssl_server_name the TLS handshake with
    # Cloudflare fails as a silent 502.
    location ^~ /ingest/static/ {
        set $ph_assets eu-assets.i.posthog.com;
        rewrite ^/ingest/static/(.*)$ /static/$1 break;
        proxy_pass https://$ph_assets;
        proxy_set_header Host eu-assets.i.posthog.com;
        proxy_ssl_server_name on;
        proxy_ssl_name eu-assets.i.posthog.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ^~ /ingest/ {
        set $ph_api eu.i.posthog.com;
        rewrite ^/ingest/(.*)$ /$1 break;
        proxy_pass https://$ph_api;
        proxy_set_header Host eu.i.posthog.com;
        proxy_ssl_server_name on;
        proxy_ssl_name eu.i.posthog.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Load-bearing: cookieless analytics counts visitors by a hash of client IP and user agent,
        # so without the real IP every visitor collapses into one.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # Prerendered pages are served by file (index.html for /); every other address is a
    # client-side route and gets the unrendered shell, never the home page's prerendered HTML.
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header Content-Security-Policy-Report-Only $csp_report_only always;
        add_header X-Robots-Tag $robots_tag always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.csr.html;
    }

    # Hashed build output (outputHashing "all"): a new build is a new URL, so cache for a year.
    location ~* \.(?:js|css)$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag $robots_tag always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fixed-name files from public/: a day, so a replaced icon reaches returning visitors.
    location ~* \.(?:woff2?|png|jpg|jpeg|gif|svg|ico|webmanifest)$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag $robots_tag always;
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Page documents are rebuilt under the same names on every deploy: never cached.
    location ~ \.html$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header Content-Security-Policy-Report-Only $csp_report_only always;
        add_header X-Robots-Tag $robots_tag always;
        add_header Cache-Control "no-cache";
    }
}
